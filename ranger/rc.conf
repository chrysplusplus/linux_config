# Don't hide anything from me
set hidden_filter
set show_hidden true

# How many columns are there, and what are their relative widths?
# Column rations
set column_ratios 1,3,2

# Disable previews for files
set preview_files false

# Abbreviate home
set tilde_in_titlebar true

# Scroll offset
set scroll_offset 0

# Line numbers
set line_numbers relative

# Map D -> delete file
map D console delete

# Map P -> preview file
map P shell less -- %f

# Map R -> send to nvim
map R console shell nvim --server /run/user/$UID/nvim.`pidof -s nvim`.0 --remote %d/%f

